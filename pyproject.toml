[project]
name = "genai-nodes"
version = "0.1.0"
description = "A nonoha-engine plugin that calls generative AI models: LLMs describe images or interpret signals and features. Event-driven, paced, with a daily request cap."
readme = "README.md"
authors = [{name = "VIE Inc."}]
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
keywords = ["nonoha", "dataflow", "node-graph", "generative-ai", "llm", "gemini", "claude", "openrouter"]
requires-python = ">=3.11"
dependencies = [
    # REST client shared with the SDKs below; used directly for OpenRouter.
    "httpx2>=2.0,<3",
    # Vendor SDKs contain native extensions; mobile hosts should call a relay server instead.
    "google-genai>=3.3,<4; sys_platform != 'android' and sys_platform != 'ios'",
    "anthropic>=2.8,<3; sys_platform != 'android' and sys_platform != 'ios'",
]

[project.urls]
Homepage   = "https://github.com/viestyle-dev/genai-nodes"
Repository = "https://github.com/viestyle-dev/genai-nodes"
Issues     = "https://github.com/viestyle-dev/genai-nodes/issues"

[dependency-groups]
dev = [
    "pytest>=8.0",
    # Environment values (nonoha_core.environment) arrive in nonoha-core 1.1.
    # Until 1.1 is tagged, this is the commit that has them.
    "nonoha-core @ git+https://github.com/viestyle-dev/nonoha-core.git@8ed784d8c316254d51050f1a0857d22ffde68d2e",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["genai_nodes"]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.nonoha-hub]
engine-compatibility = [">=1.1.0.dev0", "<2.0.0"]
